<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Independent Environmental Solutions logo</title>
  <desc id="desc">Layered navy and sage ridgelines above the Independent Environmental Solutions wordmark.</desc>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Background ridge: starts behind foreground ridge and extends farther right -->
  <path
    d="M570 324
       C635 292 681 291 737 257
       C783 228 826 230 864 255
       C900 280 927 310 967 316
       C1012 322 1046 307 1088 326
       C1128 344 1161 374 1205 379
       C1252 385 1288 374 1327 391
       C1369 408 1396 438 1439 447
       C1480 455 1511 472 1540 490"
    fill="none"
    stroke="#708A73"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Foreground ridge -->
  <path
    d="M72 386
       C164 380 246 345 333 300
       C382 275 428 276 469 296
       C512 317 547 347 596 355
       C646 363 677 362 720 382
       C764 402 803 421 849 421
       C894 421 919 406 962 414
       C1004 422 1045 442 1087 455
       C1127 468 1165 473 1203 476"
    fill="none"
    stroke="#17364A"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Main wordmark -->
  <text
    x="72"
    y="590"
    fill="#17364A"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="168"
    font-weight="400"
    letter-spacing="14">INDEPENDENT</text>

  <!-- Descriptor with balanced decorative bars -->
  <line x1="78" y1="664" x2="195" y2="664"
        stroke="#708A73" stroke-width="8" stroke-linecap="square"/>

  <text
    x="230"
    y="690"
    fill="#17364A"
    font-family="Arial, Helvetica, sans-serif"
    font-size="55"
    font-weight="600"
    letter-spacing="15">ENVIRONMENTAL SOLUTIONS</text>

  <line x1="1393" y1="664" x2="1515" y2="664"
        stroke="#708A73" stroke-width="8" stroke-linecap="square"/>
</svg>